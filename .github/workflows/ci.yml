name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no model, no network)
        run: python3 -m unittest discover -s tests
      - name: Boundary guard
        run: python3 scripts/pipeline.py guard .
